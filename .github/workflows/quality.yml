name: JARVIS quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q app.py agents config core memory plugins providers tools ui tests
      - name: Verify no secrets are tracked
        shell: bash
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|.*\.db|.*\.db-wal|.*\.db-shm)$'
          ! git ls-files | grep -E '(^|/)__pycache__(/|$)|\.pyc$'
