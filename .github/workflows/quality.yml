name: JARVIS quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile current Python runtime
        run: python -m compileall -q *.py
      - name: Verify secrets and generated runtime files are not tracked
        shell: bash
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|.*\.pyc|__pycache__/|memory\.json)$'
